# Definición única de sitios (ecommerce) soportados.
# La resolución se realiza únicamente desde core/config/site_config.py.
# Prohibido: URLs en pages, workflows o tests.
sites:
  muebles_america:
    code: MA
    environments:
      stage:
        base_url: "https://mueblesstage.mavi.mx"
        checkout_url_pattern: "https://mcstage.mueblesamerica.mx/onestepcheckout/**"
      prod:
        base_url: "https://www.mueblesamerica.mx"
        checkout_url_pattern: "https://checkout.mueblesamerica.mx/onestepcheckout/**"
  viu:
    code: VIU
    environments:
      stage:
        base_url: "https://viustage.mavi.mx/"
        checkout_url_pattern: "https://mcstage.viu.mx/onestepcheckout/**"
      prod:
        base_url: "https://www.viu.mx/"
        checkout_url_pattern: "https://checkout.viu.mx/onestepcheckout/**"
  mavi:
    code: MAVI
    environments:
      stage:
        base_url: "https://mavistage.mavi.mx/"
        checkout_url_pattern: "**/quote/list"
      prod:
        base_url: "https://www.mavi.mx/"
        checkout_url_pattern: "**/quote/list"
