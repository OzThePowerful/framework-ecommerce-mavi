# logging.config.dictConfig del framework.
version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: >-
      %(asctime)s [%(levelname)s] %(name)s
      run_id=%(run_id)s site=%(site)s environment=%(environment)s
      browser=%(browser)s case_id=%(case_id)s %(message)s
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
