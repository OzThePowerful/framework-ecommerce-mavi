# Parámetros del checkout — Muebles América.
# `customer` selecciona la identidad MAVI_GUEST_MA_* del .env (privada,
# nunca versionada); `address` referencia claves de addresses.yaml.
# Casos relacionados: CP_EC_MA_CHECKOUT_002, CP_EC_MA_CHECKOUT_003.
guest:
  customer: "guest"
  address: "guadalajara"
  search_term: "estufa"         # término del E2E_001 (primer producto elegible con stock).
  shipping_method: "a_domicilio"  # toggle #domicilio; alternativa "sucursal" (Retiro/Click & Pick Up).
  store_state: "Jalisco"        # estado del store picker (SHIPPING_002; se elige la primera tienda).
  payment_method: "openpay_cards"  # contado por tarjeta; ver payment.yaml.
