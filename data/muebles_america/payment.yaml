# Métodos de pago — Muebles América.
# Las tarjetas son datos ficticios de sandbox OpenPay (públicos):
# versionadas aquí por decisión del equipo — las credenciales reales
# (login, API) viven en .env, nunca versionadas.
#   4111111111111111 → contado;  4242424242424242 → MSI
#   (MSI también es contado: el banco difiere los meses).
# Reglas verificadas: openpay_stores no seleccionable si total > $30,000;
# paypal_express abre ventana del proveedor (popup, fuera del dominio).
# Casos relacionados: CP_EC_MA_PAY_001.
# `card` es la forma de pago de contado de CP_EC_MA_PAY_001 (nombre del
# método, proveedor, datos de prueba y restricciones del contrato).
# Restricciones verificadas en stage MA: exige número, vencimiento y CVV
# antes de habilitar 'Pagar con Tarjeta Crédito / Débito'; la facturación
# usa la dirección de entrega por defecto; sin monto máximo observado.
card:
  method: "openpay_cards"   # Tarjeta Crédito / Débito — contado (OpenPay)
  label: "Tarjeta Crédito / Débito"  # nombre visible del método en el checkout
  provider: "OpenPay"
  status: "verified"
  # Tarjeta pública de sandbox OpenPay (ficticia — no es un PAN real)
  number: "4111111111111111"
  exp_month: "11"
  exp_year: "2028"
  cvv: "123"

card_msi:
  method: "openpay_cards"   # Mismo método; MSI = contado diferido bancario
  status: "verified"
  number: "4242424242424242"
  exp_month: "11"
  exp_year: "2028"
  cvv: "123"

cash:
  method: "openpay_stores"  # Efectivo en tiendas de conveniencia (OpenPay)
  status: "verified"
  max_amount_mxn: 30000     # > límite → radio deshabilitado, no seleccionable

transfer:
  method: "banktransfer"    # Transferencia bancaria / Pago en tienda
  status: "verified"

paypal:
  method: "paypal_express"  # Redirección/popup externo PayPal
  status: "verified"
  external_provider: true

brand_credit:
  method: "omnipro_pago_credito"  # Crédito de la marca — NO contado
  status: "verified"
