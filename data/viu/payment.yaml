# Métodos de pago — VIU.
# TODO levantamiento funcional de métodos disponibles en stage/prod
# (fuera de alcance de EC-SP01-004). Nunca guardar datos de tarjeta
# reales: solo llaves de método y estado.
# Casos relacionados: CP_EC_VIU_PAY_001.
card:
  method: "openpay_cards"   # Tarjeta Crédito / Débito — contado (OpenPay)
  status: "verified"

cash:
  method: "openpay_stores"  # Efectivo en tiendas de conveniencia (OpenPay)
  status: "verified"

transfer:
  method: "banktransfer"    # Transferencia bancaria / Pago en tienda
  status: "verified"

paypal:
  method: "paypal_express"  # Redirección externa PayPal
  status: "verified"

brand_credit:
  method: "omnipro_pago_credito"  # Crédito de la marca — NO contado
  status: "verified"
