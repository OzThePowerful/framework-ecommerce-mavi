[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --alluredir=artifacts/allure-results
markers =
    architecture: controles de reglas arquitectónicas
    unit: pruebas unitarias sin navegador
    integration: pruebas de integración
    smoke: pruebas E2E UI contra el sitio configurado
    regression: suite de regresión
    bdd: escenarios Gherkin
    home: escenarios del módulo Home
    search: escenarios del módulo Search
    negative: escenarios funcionales negativos
    pdp: escenarios del módulo Product Detail Page
    cart: escenarios del módulo Cart
    commercial_validation: validaciones de consistencia comercial PDP→Cart
    checkout: escenarios del módulo Checkout
    customer: escenarios de datos del comprador
    shipping: escenarios de domicilio y método de entrega
    payment: escenarios del módulo Payment
    cash_sale: escenarios de venta de contado
    pending: escenario definido y trazable; automatización pendiente
    muebles_america: escenario exclusivo de Muebles América (test_cases/muebles_america/)
    viu: escenario exclusivo de VIU (test_cases/viu/)
    HOME_001: case id BDD (materializa CP_EC_<CODE>_HOME_001)
    SEARCH_001: case id BDD
    SEARCH_002: case id BDD
    PDP_001: case id BDD
    PDP_002: case id BDD
    CART_001: case id BDD
    CART_002: case id BDD
    CHECKOUT_001: case id BDD
    CHECKOUT_002: case id BDD
    CHECKOUT_003: case id BDD
    CUSTOMER_001: case id BDD
    ADDRESS_001: case id BDD
    SHIPPING_001: case id BDD
    SHIPPING_002: case id BDD
    PAY_001: case id BDD
    PAY_002: case id BDD
    PAY_003: case id BDD
    ORDER_001: case id BDD
    ORDER_002: case id BDD
    SMOKE_001: case id BDD
    E2E_001: case id BDD
